<title>ArkCad</title>

<style>
/* Tata letak: editor satu layar ala KiCad (rel alat, pustaka, kanvas, panel info), rupa kisi meniru layar cetak biru AIC. */
:root {
  --lantai: #dcdddf; --panel: #f3f3f1; --panel2: #e8e8e5; --garis: #c7c8c8; --tinta: #17181a; --redup: #63666b;
  --sabuk: #f4ec6a; --aksen: #1668e3; --galat: #d7263d; --awas: #d98a00; --oke: #2f8f46; --hitam: #111214;
  --ui: "Barlow Semi Condensed", "Segoe UI", "Arial Narrow", sans-serif;
  --judul: "Chakra Petch", "Barlow Semi Condensed", "Segoe UI", sans-serif;
  --angka: "JetBrains Mono", Consolas, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
body { background: var(--lantai); color: var(--tinta); font: 500 14px/1.3 var(--ui); overflow: hidden; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--aksen); outline-offset: 1px; }
#app { height: 100%; display: grid; grid-template: 44px minmax(0, 1fr) 26px / 46px 232px minmax(0, 1fr) 340px; grid-template-areas: "atas atas atas atas" "rel pustaka kanvas info" "status status status status"; }
#app.lebar { grid-template-columns: 46px 232px minmax(0, 1fr) 480px; }
#atas { grid-area: atas; background: var(--hitam); color: #f2f2ee; display: flex; align-items: center; gap: 4px; padding-inline: max(10px, env(safe-area-inset-left, 0px)) max(10px, env(safe-area-inset-right, 0px)); overflow-x: auto; scrollbar-width: none; }
#merek { font: 700 18px var(--judul); letter-spacing: .02em; margin-right: 8px; white-space: nowrap; }
#merek b { color: var(--sabuk); font-weight: 700; }
#namaDoc { background: transparent; border: 1px solid #3a3b3f; padding: 3px 7px; width: 190px; min-width: 110px; color: #f2f2ee; }
.tb { background: transparent; border: 1px solid transparent; color: inherit; padding: 4px 9px; white-space: nowrap; }
.tb:hover { background: #2a2b2f; }
.tb[aria-pressed="true"] { background: var(--sabuk); color: var(--hitam); font-weight: 600; }
.tb:disabled { opacity: .4; cursor: default; }
.pisah { width: 1px; height: 22px; background: #3a3b3f; margin-inline: 5px; flex: none; }
#simpanStatus { margin-left: auto; color: #b5b6b1; white-space: nowrap; padding-inline: 8px; font-size: 13px; }
#rel { grid-area: rel; background: var(--panel2); border-right: 1px solid var(--garis); display: flex; flex-direction: column; align-items: center; gap: 2px; padding-block: 6px; overflow-y: auto; scrollbar-width: none; }
.alat { width: 40px; height: 42px; padding: 3px 0 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; background: transparent; border: 1px solid transparent; position: relative; flex: none; }
.labelAlat { font: 600 10px/1 var(--ui); }
.alat.w-sabuk svg { color: #8f7400; } .alat.w-pipa svg { color: #1257c4; } .alat.w-hapus svg { color: #bd1c32; }
.alat[aria-pressed="true"] svg { color: var(--sabuk); }
.alat:hover { background: #d9d9d5; }
.alat[aria-pressed="true"] { background: var(--hitam); color: var(--sabuk); }
.alat svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.alat kbd { position: absolute; right: 2px; top: 1px; font: 600 9px var(--angka); opacity: .55; }
.relpisah { width: 26px; height: 1px; background: var(--garis); margin-block: 4px; flex: none; }
#pustaka { grid-area: pustaka; background: var(--panel); border-right: 1px solid var(--garis); display: flex; flex-direction: column; min-height: 0; }
#cari { margin: 8px; padding: 6px 8px; border: 1px solid var(--garis); background: #fff; }
#daftarPustaka { overflow-y: auto; flex: 1; min-height: 0; padding-bottom: 12px; }
.saringPustaka { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 0 8px 6px; }
.saringPustaka button { padding: 3px 4px; background: #fff; border: 1px solid var(--garis); font: 600 12px var(--ui); }
.saringPustaka button:hover { background: var(--panel2); }
.saringPustaka button[aria-pressed="true"] { background: var(--hitam); color: var(--sabuk); border-color: var(--hitam); }
.grup { display: flex; align-items: center; gap: 5px; width: calc(100% - 16px); margin: 8px 8px 3px; padding: 4px 6px; background: var(--panel2); border: 0; border-left: 3px solid var(--garis); font: 700 12px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--tinta); text-align: left; }
button.grup:hover { background: var(--garis); }
.grup.aHijau { border-left-color: var(--oke); } .grup.aBiru { border-left-color: var(--aksen); } .grup.aKuning { border-left-color: #c9a100; } .grup.aAbu { border-left-color: var(--redup); }
.panahGrup { font-size: 10px; color: var(--redup); }
.jumlahGrup { margin-left: auto; font: 600 11px var(--angka); color: var(--redup); }
.baris { display: flex; align-items: center; gap: 8px; width: calc(100% - 16px); margin: 0 8px 2px; padding: 3px 6px 3px 3px; background: #fff; border: 1px solid transparent; text-align: left; }
.baris:hover { border-color: var(--tinta); }
.baris[aria-pressed="true"] { background: var(--hitam); border-color: var(--hitam); color: var(--sabuk); }
.baris img { width: 36px; height: 36px; flex: none; }
.baris .t { min-width: 0; flex: 1; line-height: 1.15; }
.namaBaris { display: block; font: 600 13px/1.15 var(--ui); }
.pilBaris { display: flex; flex-wrap: wrap; gap: 2px 3px; margin-top: 2px; }
.pilK { font: 500 10px/14px var(--ui); padding-inline: 4px; background: var(--panel2); color: #3c3e42; }
.pilK.daya { background: #f7ead0; color: #7d4a05; } .pilK.wuling { background: #dce7f8; color: #1257c4; }
.jumlahBaris { flex: none; font: 700 12px var(--angka); color: #17703a; }
.baris[aria-pressed="true"] .jumlahBaris { color: var(--sabuk); }
.kosongPustaka { padding: 6px 10px; }
#modeLahan { display: inline-flex; gap: 2px; margin-right: 6px; flex: none; }
.modeKebun #vSabuk { display: none; }
.catatanLahan { padding: 6px 8px 8px; }
.daftarUnduh { display: flex; flex-direction: column; gap: 4px; margin-block: 8px; }
.barisUnduh { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 9px; background: #fff; border: 1px solid var(--garis); }
.barisUnduh b { font: 700 14px var(--ui); }
.barisUnduh .tombol { flex: none; min-width: 84px; }
.kotakKode { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid var(--garis); background: #fff; font: 400 11px/1.3 var(--angka); resize: vertical; word-break: break-all; margin-block: 4px; }
.baris.mati { opacity: .55; cursor: not-allowed; } .baris.mati:hover { border-color: transparent; }
#tengah { grid-area: kanvas; position: relative; min-width: 0; min-height: 0; overflow: hidden; }
#kanvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#tip { position: absolute; pointer-events: none; background: var(--hitam); color: #f2f2ee; padding: 4px 8px; font-size: 13px; max-width: 280px; z-index: 5; line-height: 1.25; }
#tip small { color: #b5b6b1; font: 400 11px var(--angka); display: block; }
#petunjuk { position: absolute; left: 10px; top: 10px; background: rgba(17,18,20,.86); color: #f2f2ee; padding: 4px 9px; font-size: 13px; pointer-events: none; max-width: calc(100% - 20px); }
#info { grid-area: info; background: var(--panel); border-left: 1px solid var(--garis); display: flex; flex-direction: column; min-height: 0; }
#tab { display: flex; border-bottom: 1px solid var(--garis); flex: none; }
#tab button { flex: 1 1 auto; background: var(--panel2); border: 0; border-right: 1px solid var(--garis); padding: 7px 3px; font-weight: 600; font-size: 13px; }
#tab button:last-child { border-right: 0; }
#tab button[aria-selected="true"] { background: var(--panel); box-shadow: inset 0 3px 0 var(--hitam); }
.lencana { display: inline-block; min-width: 16px; padding-inline: 4px; font: 600 11px/16px var(--angka); color: #fff; background: var(--oke); text-align: center; margin-left: 3px; }
.lencana.err { background: var(--galat); } .lencana.warn { background: var(--awas); }
#isiInfo { overflow-y: auto; flex: 1; min-height: 0; padding: 10px 12px 18px; display: flex; flex-direction: column; gap: 10px; }
h2 { font: 700 16px/1.15 var(--judul); margin: 0; text-wrap: balance; }
h3 { font: 600 12px var(--ui); letter-spacing: .09em; text-transform: uppercase; color: var(--redup); margin: 0 0 3px; }
.sub { color: var(--redup); font-size: 13px; }
.kv { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 1px 10px; font-size: 13px; }
.kv dt { color: var(--redup); } .kv dd { margin: 0; text-align: right; font-family: var(--angka); font-size: 12px; font-variant-numeric: tabular-nums; }
.kolom { display: flex; flex-direction: column; gap: 3px; }
.isian { display: grid; grid-template-columns: minmax(0,1fr) 88px; gap: 4px 8px; align-items: center; font-size: 13px; }
.isian input, .isian select { width: 100%; padding: 3px 5px; border: 1px solid var(--garis); background: #fff; font-family: var(--angka); font-size: 12px; }
.tombol { border: 1px solid var(--tinta); background: transparent; padding: 4px 10px; }
.tombol:hover { background: var(--hitam); color: #f2f2ee; }
.tombol.utama { background: var(--hitam); color: var(--sabuk); }
.deret { display: flex; flex-wrap: wrap; gap: 6px; }
.meter { height: 8px; background: var(--panel2); border: 1px solid var(--garis); position: relative; }
.meter i { position: absolute; inset: 0 auto 0 0; background: var(--oke); display: block; }
.meter.warn i { background: var(--awas); } .meter.err i { background: var(--galat); }
.resep { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; width: 100%; padding: 4px 6px; border: 1px solid transparent; background: none; text-align: left; font-size: 12px; font-family: var(--angka); }
.resep:hover { background: var(--panel2); }
.resep[aria-pressed="true"] { background: var(--sabuk); border-color: var(--tinta); }
.chip { display: inline-flex; align-items: center; gap: 2px; }
.chip img { width: 24px; height: 24px; }
.panah { color: var(--redup); }
.resep .w { margin-left: auto; color: var(--redup); font-size: 11px; }
.namaResep { flex-basis: 100%; font: 500 13px var(--ui); }
.temuan { display: grid; grid-template-columns: 14px minmax(0,1fr); gap: 7px; padding: 5px 6px; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--panel2); text-align: left; font-size: 13px; line-height: 1.25; }
.temuan:hover { background: var(--panel2); }
.temuan i { width: 12px; height: 12px; margin-top: 2px; display: block; background: var(--oke); }
.temuan.err i { background: var(--galat); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.temuan.warn i { background: var(--awas); clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.temuan.info i { background: var(--aksen); border-radius: 50%; }
.neraca { width: 100%; border-collapse: collapse; font-size: 12px; background: #fff; }
.neraca th { font: 600 11px var(--ui); color: #f2f2ee; background: var(--hitam); text-align: right; padding: 4px 5px; white-space: nowrap; }
.neraca th:first-child { text-align: left; }
.neraca td { padding: 4px 5px; text-align: right; font-family: var(--angka); font-variant-numeric: tabular-nums; border-bottom: 1px solid var(--panel2); white-space: nowrap; }
.neraca td:first-child { text-align: left; font: 500 13px var(--ui); white-space: normal; }
.neraca tbody tr:nth-child(even) { background: #f7f7f5; }
.neraca tfoot td { font-weight: 700; background: var(--panel2); border-top: 2px solid var(--tinta); border-bottom: 0; }
.neraca td img { width: 20px; height: 20px; flex: none; }
.neraca .selNama { display: flex; align-items: center; gap: 6px; min-width: 104px; }
.neraca .ikonBesar { width: 34px; height: 34px; }
.namaBrg { min-width: 0; flex: 1; line-height: 1.15; }
.ketBrg { font: 400 11px var(--ui); color: var(--redup); margin-top: 2px; }
.gulirTabel { overflow-x: auto; border: 1px solid var(--garis); }
.angkaKecil { width: 44px; padding: 1px 3px; border: 1px solid var(--garis); background: #fff; font: 400 11px var(--angka); text-align: right; }
.angkaStok { width: 58px; padding: 1px 3px; border: 1px solid var(--garis); background: #fff; font: 400 11px var(--angka); text-align: right; }
.bagian { display: flex; flex-direction: column; gap: 5px; padding-left: 8px; border-left: 3px solid var(--garis); }
.bagian h3 { color: var(--tinta); font-size: 13px; }
.bagian.aHijau { border-left-color: var(--oke); } .bagian.aBiru { border-left-color: var(--aksen); } .bagian.aKuning { border-left-color: #c9a100; } .bagian.aMerah { border-left-color: var(--galat); } .bagian.aAbu { border-left-color: var(--redup); }
.bagian details { border-top: 1px solid var(--panel2); padding-top: 3px; }
.bagian summary { cursor: pointer; font: 600 12px var(--ui); padding-block: 3px; }
.bagian details[open] summary { margin-bottom: 3px; }
.statGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.stat { display: flex; flex-direction: column; gap: 1px; padding: 7px 9px; background: #fff; border: 1px solid var(--garis); min-width: 0; }
.stat b { font: 700 19px/1.1 var(--judul); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.statLabel { font: 600 11px var(--ui); color: var(--redup); }
.statKet { font: 400 11px var(--ui); color: var(--redup); }
.stat.utama { background: var(--hitam); border-color: var(--hitam); } .stat.utama b { color: var(--sabuk); } .stat.utama .statLabel, .stat.utama .statKet { color: #c9cacc; }
.stat.cUang b, .cUang { color: #17703a; } .stat.cBiru b, .cBiru { color: #1257c4; } .stat.cHijau b, .cHijau { color: #17703a; } .stat.cAwas b, .cAwas { color: #96590a; } .stat.cMerah b, .cMerah { color: #bd1c32; }
.tebal { font-weight: 700; } .redup { color: #8a8d91; }
.wBaik, .wAwas, .wBuruk { font-weight: 700; }
.wBaik { color: #17703a; } .wAwas { color: #96590a; } .wBuruk { color: #bd1c32; }
.meter.tipis { height: 5px; min-width: 34px; } .meter.uang i { background: #c9a100; }
.spanduk { display: flex; flex-direction: column; gap: 2px; padding: 9px 11px; color: #fff; }
.spanduk b { font: 700 17px/1.15 var(--judul); text-wrap: balance; }
.spanduk span { font: 400 12px var(--ui); opacity: .92; }
.spanduk.err { background: #bd1c32; } .spanduk.warn { background: #8a5208; } .spanduk.oke { background: #17703a; }
.deretChip { display: flex; flex-wrap: wrap; gap: 4px; }
.chipLvl { font: 600 11px/18px var(--ui); padding-inline: 7px; border: 1px solid currentColor; }
.chipLvl.err { color: #bd1c32; } .chipLvl.warn { color: #96590a; } .chipLvl.info { color: #1257c4; } .chipLvl.nol { color: #8a8d91; }
.tabelCek td { white-space: normal; vertical-align: top; }
.neraca.tabelCek td.selCek { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.tabelCek .ketCek { text-align: left; font: 500 12px/1.2 var(--ui); }
.tabelCek th:last-child { text-align: left; }
.tandaCek { flex: none; width: 16px; height: 16px; display: grid; place-items: center; color: #fff; font: 700 11px/1 var(--ui); background: #8a8d91; }
.tandaCek.oke { background: #17703a; } .tandaCek.err { background: #bd1c32; } .tandaCek.warn, .tandaCek.info { background: #96590a; }
.temuan2 { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; width: 100%; padding: 7px 8px; background: #fff; border: 1px solid var(--garis); border-left-width: 3px; text-align: left; align-items: start; }
.temuan2:hover { background: var(--panel2); }
.temuan2.err { border-left-color: #bd1c32; } .temuan2.warn { border-left-color: #c9a100; } .temuan2.info { border-left-color: var(--aksen); }
.tandaLvl img { width: 30px; height: 30px; display: block; }
.tandaLvl i { display: block; width: 18px; height: 18px; margin: 5px; background: #8a8d91; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
.temuan2.err .tandaLvl i { background: #bd1c32; } .temuan2.warn .tandaLvl i { background: #c9a100; }
.teksTemuan { font: 600 13px/1.2 var(--ui); color: var(--tinta); }
.temuan2.err .teksTemuan { color: #bd1c32; } .temuan2.warn .teksTemuan { color: #7d4a05; }
.saranTemuan { font: 400 12px/1.25 var(--ui); color: #2c2e31; margin-top: 2px; }
.lokTemuan { font: 400 11px var(--angka); color: #1257c4; margin-top: 3px; }
.jumlahTemuan { font: 700 12px var(--angka); color: var(--redup); }
.kepalaMesin { display: flex; gap: 10px; align-items: center; }
.kepalaMesin img { width: 52px; height: 52px; flex: none; background: #fff; border: 1px solid var(--garis); padding: 3px; }
.selTombol { text-align: left; }
.neraca td.selTombol { white-space: normal; }
.selTombol kbd { display: inline-block; font: 600 11px/16px var(--angka); padding-inline: 5px; margin: 1px 3px 1px 0; background: var(--hitam); color: var(--sabuk); }
.pilihProduk { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 4px; }
.pilihProduk button { display: flex; align-items: center; gap: 5px; padding: 4px 5px; background: #fff; border: 1px solid var(--garis); font: 600 12px/1.1 var(--ui); text-align: left; }
.pilihProduk button:hover { background: var(--panel2); }
.pilihProduk button[aria-pressed="true"] { background: var(--hitam); color: var(--sabuk); border-color: var(--hitam); }
.pilihProduk img { width: 26px; height: 26px; flex: none; }
.mata2 { display: flex; flex-direction: column; gap: 2px; padding: 5px 7px; background: #fff; border: 1px solid var(--garis); border-left: 3px solid var(--tinta); }
.mata2 .mataKet img { width: 18px; height: 18px; vertical-align: -5px; margin-right: 3px; }
.pil { display: inline-block; padding: 0 5px; font: 600 11px/16px var(--ui); background: var(--panel2); color: #3c3e42; }
.pil.baik { background: #dcefe1; color: #17703a; } .pil.buruk { background: #f9dfe2; color: #bd1c32; } .pil.awas { background: #f7ead0; color: #96590a; }
.deretSaring { display: flex; flex-wrap: wrap; gap: 3px; }
.deretSaring button { padding: 2px 7px; background: #fff; border: 1px solid var(--garis); font: 600 12px var(--ui); }
.deretSaring button:hover { background: var(--panel2); }
.deretSaring button[aria-pressed="true"] { background: var(--hitam); color: var(--sabuk); border-color: var(--hitam); }
.ruas2 { display: grid; grid-template-columns: 26px minmax(0, 1fr) 76px; gap: 7px; align-items: center; width: 100%; padding: 5px 7px; background: #fff; border: 1px solid var(--garis); text-align: left; }
.ruas2:hover { background: var(--panel2); }
.ruas2.putus { background: #f9dfe2; border-color: #bd1c32; }
.ruas2 img, .ruas2 .ruasKosong { width: 26px; height: 26px; display: block; }
.ruasArah { display: block; font: 600 13px/1.15 var(--ui); }
.panahRuas { color: var(--redup); }
.tandaRuas { display: flex; flex-wrap: wrap; gap: 2px 5px; margin-top: 2px; font: 400 11px/1.3 var(--ui); }
.tagRuas { background: var(--panel2); padding-inline: 4px; color: #3c3e42; } .tagRuas.buruk { background: #f9dfe2; color: #bd1c32; }
.ruasAngka { display: flex; flex-direction: column; gap: 2px; align-items: stretch; text-align: right; font: 400 11px var(--angka); }
.mata { display: flex; flex-direction: column; gap: 1px; padding: 3px 0 3px 5px; border-left: 2px solid var(--garis); }
.mataAtas { display: flex; align-items: center; gap: 5px; }
.mataAtas img { width: 22px; height: 22px; flex: none; }
.mataNama { min-width: 0; font-weight: 600; font-size: 13px; line-height: 1.1; }

<script>
// Inti ArkCad: geometri mesin, port, jaringan sabuk/pipa, perute, simulasi, pemeriksaan.
// Tanpa DOM supaya bisa diuji di Node. Arah: 0=T(timur) 1=S 2=B 3=U, sumbu y ke bawah.
const AIC = (() => {
  const DX = [1, 0, -1, 0], DY = [0, 1, 0, -1];
  const key = (x, y) => x + "," + y;
  const lawan = d => (d + 2) % 4;
  let D = null;   // data.json + mesin tambahan
  let RES = {};   // id resep -> resep

  // Mesin yang tidak ada di data ekstrak. Ukuran rig dari Game8; tiang dan relay 2x2 diukur dari
  // tangkapan layar cetak biru game.
  const TAMBAHAN = {
    rig_port: { n: "Portable Originium Rig", t: 1, p: 0, w: 3, d: 3, bi: 0, pi: 0, bo: 3, po: 0, sumber: "tambang" },
    rig_1: { n: "Electric Mining Rig", t: 1, p: 5, w: 3, d: 3, bi: 0, pi: 0, bo: 3, po: 0, sumber: "tambang" },
    rig_2: { n: "Electric Mining Rig Mk II", t: 2, p: 10, w: 3, d: 3, bi: 0, pi: 0, bo: 3, po: 0, sumber: "tambang" },
    pylon: { n: "Electric Pylon", t: 1, p: 0, w: 2, d: 2, bi: 0, pi: 0, bo: 0, po: 0, listrik: "tiang" },
    // Lahan utama: PAC dan Depot Bus boleh dipindah dan diputar (kata user, ukuran dari data EnKAD)
    pac: { n: "PAC", t: 1, p: 0, w: 9, d: 9, bi: 0, pi: 0, bo: 0, po: 0, statis: true, hub: true },
    bus_port: { n: "Depot Bus Port", t: 1, p: 0, w: 4, d: 4, bi: 0, pi: 0, bo: 0, po: 0, statis: true },
    bus: { n: "Depot Bus Section", t: 1, p: 0, w: 8, d: 4, bi: 0, pi: 0, bo: 0, po: 0, statis: true },
    // Pembuang cairan dan penyangga barang yang terlihat di denah Wuling 1.2
    dumper_1: { n: "Pembuang Cairan", t: 3, p: 0, w: 3, d: 3, bi: 0, pi: 1, bo: 0, po: 0, buang: "limbah", wuling: true },
    penyangga: { n: "Penyangga", t: 2, p: 0, w: 3, d: 3, bi: 3, pi: 0, bo: 3, po: 0, lewat: true },
    stash: { n: "Protocol Stash", t: 2, p: 5, w: 3, d: 3, bi: 3, pi: 0, bo: 3, po: 0, buang: "depot" },
    pylon_x: { n: "Xiranite Pylon", t: 3, p: 0, w: 2, d: 2, bi: 0, pi: 0, bo: 0, po: 0, listrik: "tiang", menara: true, wuling: true },
    conduit_out: { n: "Conduit Outlet", t: 3, p: 0, w: 3, d: 3, bi: 0, pi: 0, bo: 0, po: 1, sumber: "pompa", laju: 60, wuling: true },
    relay: { n: "Relay Tower", t: 1, p: 0, w: 2, d: 2, bi: 0, pi: 0, bo: 0, po: 0, listrik: "relay" },
    // Kebun. Ukuran dan port dari data EnKAD; ukuran Auto-Farmer tidak ada di sumber, hanya penanda.
    sprinkler: { n: "Sprinkler", t: 3, p: 10, w: 3, d: 3, bi: 0, pi: 1, bo: 0, po: 0, buang: "limbah", semprot: true, wuling: true },
    liquid_storager_1: { n: "Fluid Tank", t: 2, p: 0, w: 3, d: 3, bi: 0, pi: 1, bo: 0, po: 1, lewat: true, wuling: true },
    autofarmer: { n: "Auto-Farmer", t: 3, p: 0, w: 3, d: 3, bi: 0, pi: 0, bo: 0, po: 0, autofarm: true },
  };
  const PETAK = [
    ["soil_sp_3", "Redjade Ginseng", "item_plant_sp_3", "wuling"], ["soil_sp_4", "Amber Rice", "item_plant_sp_4", "wuling"],
    ["soil_grass_2", "Yazhen", "item_plant_grass_2", "wuling", "Thorny Yazhen"], ["soil_grass_1", "Jincao", "item_plant_grass_1", "wuling", "Fluffed Jincao"],
    ["soil_sp_1", "Reed Rye", "item_plant_sp_1", "valley"], ["soil_sp_2", "Tartpepper", "item_plant_sp_2", "valley"],
    ["soil_moss_1", "Buckflower", "item_plant_moss_1", "valley", "Firebuckle"], ["soil_moss_2", "Citrome", "item_plant_moss_2", "valley", "Umbraline"],
    ["soil_bbflower_1", "Aketine", "item_plant_bbflower_1", "valley"], ["soil_moss_3", "Sandleaf", "item_plant_moss_3", "valley"],
  ].concat(["Cabbage", "Sourberry", "Crunchcane", "Matoberry", "Whitemelon", "Relishroom", "Pingtuber", "Ballpea", "Oilseed Bloom"].map(n => ["soil_corp_" + n.split(" ")[0].toLowerCase(), n, null, "lukisan"]));
  for (const [id, tanaman, i, lahan, varian] of PETAK) TAMBAHAN[id] = { n: tanaman + " Plot", t: 2, p: 0, w: 4, d: 4, bi: 0, pi: 0, bo: 0, po: 0, petak: true, tanaman, i, lahan, varian, ukuranTebak: lahan === "lukisan" };
  const TAMBANG = ["item_originium_ore", "item_iron_ore", "item_quartz_sand", "item_copper_ore"];

  const NAMA_ID = {
    furnance_1: "Unit Rafinasi", grinder_1: "Unit Pencacah", winder_1: "Unit Perakit", component_mc_1: "Unit Pengepas",
    shaper_1: "Unit Cetakan", filling_powder_mc_1: "Unit Pengisi", tools_assebling_mc_1: "Unit Pengemas",
    seedcollector_1: "Unit Petik Benih", planter_1: "Unit Penanam", thickener_1: "Unit Giling", mix_pool_1: "Reaktor Lebur",
    dismantler_1: "Unit Pemisah", pump_1: "Pompa Cairan", power_station_1: "Bank Termal", loader_1: "Pemuat Depot",
    unloader_1: "Pembongkar Depot", rig_1: "Rig Tambang Elektrik", rig_2: "Rig Tambang Mk II", rig_port: "Rig Originium Portabel",
    pylon: "Tiang Listrik", relay: "Menara Relay",
  };

  function muat(data) {
    D = data;
    Object.assign(D.mesin, TAMBAHAN);
    for (const id in NAMA_ID) { D.mesin[id].en = D.mesin[id].n; D.mesin[id].n = NAMA_ID[id]; }
    for (const id of ["pump_1", "pump_2"]) { D.mesin[id].sumber = "pompa"; }
    D.mesin.gas_pump_1.sumber = "gas";
    D.mesin.unloader_1.sumber = "depot";
    D.mesin.loader_1.buang = "depot";
    D.mesin.power_station_1.buang = "bakar";
    Object.assign(D.mesin.vaporizer_1, { buang: "limbah", kabut: true });
    RES = {};
    for (const r of D.resep) RES[r.id] = r;
    D.tambang = TAMBANG;
    return D;
  }

  const LAJU = { sabuk: 30, pipa: 120, pompa: 60, depot: 30 };
  const PERIODE = { b: 4, p: 1 }; // satu tick = 0,5 dtk; sabuk 1 barang/2 dtk, pipa 2 barang/dtk
  const TAHAN = { b: 2, p: 1 };   // lama minimal barang di satu tile; kecepatan asli di game belum terukur

  function docBaru(nama) {
    return { v: 2, nama: nama || "Rancangan baru", area: { w: 64, h: 44 }, dayaDasar: 200, m: [], b: {}, p: {}, seq: 1 };
  }

  // ---- kebun: lahan tanam di luar AIC ----
  // Ukuran petak 4x4, Sprinkler 3x3, Fluid Tank 3x3 dari data bangunan di EnKAD. Jangkauan Sprinkler tidak ada di
  // sumber mana pun: panduan GameWith hanya menyebut dua petak tepat di depannya, jadi kotak 8x4 adalah anggapan.
  const LAHAN_KEBUN = {
    wuling: { n: "Agricultural Test Site", tempat: "Wuling City", maks: 20, area: { w: 24, h: 44 }, sprinkler: true, otomatis: true },
    valley: { n: "Eco-Farm", tempat: "Originium Science Park, Valley IV", maks: 16, area: { w: 20, h: 20 }, sprinkler: false, otomatis: false },
    lukisan: { n: "Farm Si's Painting", tempat: "Yuanyuan Manor, Wuling", maks: null, area: { w: 24, h: 24 }, sprinkler: false, otomatis: true },
  };
  function kebunDoc(doc) {
    const a = doc.kebun && typeof doc.kebun === "object" ? doc.kebun : {};
    const angka = (v, d, lo, hi) => (v !== null && v !== "" && Number.isFinite(+v) ? Math.max(lo, Math.min(hi, +v)) : d);
    return {
      lahan: LAHAN_KEBUN[a.lahan] ? a.lahan : "wuling", menit: angka(a.menit, 60, 1, 10080), hasil: angka(a.hasil, 2, 0, 1000), panen: angka(a.panen, 3, 0, 1440),
      pupuk: typeof a.pupuk === "string" ? a.pupuk : "", xHasil: angka(a.xHasil, 1, 0, 100), xWaktu: angka(a.xWaktu, 1, 0.01, 10), semprotL: angka(a.semprotL, 8, 1, 40), semprotJ: angka(a.semprotJ, 4, 1, 40),
    };
  }
  function kebunBaru(lahan, nama) {
    const L = LAHAN_KEBUN[lahan] || LAHAN_KEBUN.wuling;
    return Object.assign(docBaru(nama || "Kebun " + L.n), { jenis: "kebun", kebun: { lahan: LAHAN_KEBUN[lahan] ? lahan : "wuling" }, tepiLuar: true, area: { w: L.area.w, h: L.area.h } });
  }
  // Tata letak panduan: 5 baris 4 kolom, tiap Sprinkler menghadap dua petak di depannya, 6 tiang, pompa di air sisi barat.
  function kebunContoh() {
    const doc = kebunBaru("wuling", "Kebun Wuling 20 petak");
    const taruh = (f, x, y, s) => { const m = Object.assign({ id: "m" + doc.seq++, f, x, y, r: 0 }, s); doc.m.push(m); return m; };
    const pipa = (x, y, t) => { doc.p[key(x, y)] = t; };
    const tanam = ["soil_sp_3", "soil_sp_3", "soil_sp_4", "soil_sp_4"].concat(["soil_grass_2", "soil_grass_2", "soil_grass_1", "soil_grass_1"]);
    taruh("pump_1", -5, 2, { item: "item_liquid_water" });
    pipa(-2, 3, { d: 0 });
    taruh("liquid_storager_1", -1, 2);
    pipa(2, 3, { d: 0 });
    for (let baris = 0; baris < 5; baris++) {
      const y = 3 + baris * 8;
      if (baris > 0) for (let q = y - 7; q < y; q++) pipa(3, q, { d: 1 });
      pipa(3, y, baris < 4 ? { t: "split", out: [0, 1] } : { d: 0 });
      for (let q = 4; q <= 4; q++) pipa(q, y, { d: 0 });
      pipa(5, y, { t: "split", out: [0, 1] }); pipa(5, y + 1, { d: 1 }); pipa(5, y + 2, { d: 0 });
      for (let q = 6; q <= 12; q++) pipa(q, y, { d: 0 });
      pipa(13, y, { d: 1 }); pipa(13, y + 1, { d: 1 }); pipa(13, y + 2, { d: 0 });
      for (const x of [6, 14]) taruh("sprinkler", x, y + 1);
      for (let k = 0; k < 4; k++) taruh(tanam[(baris * 4 + k) % tanam.length], 4 + k * 4, y + 4);
    }
    for (const [x, y] of [[0, 8], [0, 24], [0, 36], [20, 8], [20, 24], [20, 36]]) taruh("pylon_x", x, y);
    return doc;
  }
  function kotakSemprot(m, opsi) {
    const u = ukur(m), d = arahAlir(m.r), cx = m.x + u.w / 2, cy = m.y + u.h / 2, L = opsi.semprotL, J = opsi.semprotJ;
    if (d === 0) return { x0: m.x + u.w, x1: m.x + u.w + J, y0: cy - L / 2, y1: cy + L / 2 };
    if (d === 2) return { x0: m.x - J, x1: m.x, y0: cy - L / 2, y1: cy + L / 2 };
    if (d === 1) return { x0: cx - L / 2, x1: cx + L / 2, y0: m.y + u.h, y1: m.y + u.h + J };
    return { x0: cx - L / 2, x1: cx + L / 2, y0: m.y - J, y1: m.y };
  }
  const kotakKabut = m => { const u = ukur(m); return { x0: m.x + u.w / 2 - 6.5, x1: m.x + u.w / 2 + 6.5, y0: m.y + u.h / 2 - 6.5, y1: m.y + u.h / 2 + 6.5 }; };
  // Petak mana yang disiram otomatis. Tanpa sim, sumber dianggap sudah dapat air.
  function siramKebun(doc, sim) {
    const o = kebunDoc(doc), hasil = new Map(), pakai = new Map();
    const dapat = (m, i) => { if (!sim) return true; const h = sim.mesin[m.id]; return !!(h && h.masuk && h.masuk[i] > 0); };
    const petak = doc.m.filter(m => D.mesin[m.f].petak);
    for (const s of doc.m) {
      const f = D.mesin[s.f];
      if (f.semprot && dapat(s, "item_liquid_water")) {
        const k = kotakSemprot(s, o);
        for (const p of petak) {
          const u = ukur(p), ox = Math.min(k.x1, p.x + u.w) - Math.max(k.x0, p.x), oy = Math.min(k.y1, p.y + u.h) - Math.max(k.y0, p.y);
          // Menempel sedikit tidak dihitung: sisi lebar harus kena minimal 2 petak
          const [lebar, dalam] = arahAlir(s.r) % 2 ? [ox, oy] : [oy, ox];
          if (lebar >= Math.min(2, o.semprotL) && dalam >= 1) { hasil.set(p.id, "Sprinkler"); pakai.set(s.id, (pakai.get(s.id) || 0) + 1); }
        }
      } else if (f.kabut && dapat(s, "item_gas_water")) {
        const k = kotakKabut(s);
        for (const p of petak) {
          const u = ukur(p);
          if (p.x >= k.x0 && p.y >= k.y0 && p.x + u.w <= k.x1 && p.y + u.h <= k.y1) { hasil.set(p.id, "Gas Dispersing Unit"); pakai.set(s.id, (pakai.get(s.id) || 0) + 1); }
        }
      }
    }
    return { petak: hasil, pakai };
  }
  function periksaKebun(doc, sim, tambah) {
    const o = kebunDoc(doc), L = LAHAN_KEBUN[o.lahan], petak = doc.m.filter(m => D.mesin[m.f].petak), { petak: basah, pakai } = siramKebun(doc, sim);
    if (L.maks && petak.length > L.maks) { const [x, y] = pusat(petak[L.maks]); tambah("err", "petakMaks", `${L.n} menampung ${L.maks} petak, denah ini ${petak.length}`, x, y, petak[L.maks].id); }
    for (const m of petak) {
      const f = D.mesin[m.f], [x, y] = pusat(m);
      if (f.lahan !== o.lahan) tambah("warn", "lahanSalah", `${f.tanaman} bukan tanaman ${L.n}`, x, y, m.id);
      else if (L.sprinkler && !basah.has(m.id)) tambah("warn", "siram", `${f.n} tidak kena Sprinkler, harus disiram manual`, x, y, m.id);
    }
    const kabut = [];
    for (const m of doc.m) {
      const f = D.mesin[m.f], [x, y] = pusat(m);
      if ((f.semprot || f.kabut) && o.lahan === "valley") tambah("err", "semprot", `${f.n} tidak bisa dipakai di Valley IV`, x, y, m.id);
      else if (f.semprot && sim.mesin[m.id] && sim.mesin[m.id].masuk.item_liquid_water > 0 && !pakai.get(m.id)) tambah("warn", "semprot", `Sprinkler tidak menghadap petak mana pun`, x, y, m.id);
      if (f.kabut) {
        kabut.push(m);
        const h = sim.mesin[m.id], ada = h ? Object.keys(h.masuk).filter(i => h.masuk[i] > 0) : [];
        if (ada.length && !ada.includes("item_gas_water")) tambah("warn", "kabut", `${f.n} diisi ${D.barang[ada[0]].n}, penyiraman butuh lingkungan Humid`, x, y, m.id);
      }
      if (f.autofarm && !L.otomatis) tambah("err", "autoGanda", `Auto-Farmer tidak tersedia di ${L.n}`, x, y, m.id);
    }
    kabut.forEach((a, i) => { const ka = kotakKabut(a); for (const b of kabut.slice(i + 1)) { const kb = kotakKabut(b); if (ka.x0 < kb.x1 && kb.x0 < ka.x1 && ka.y0 < kb.y1 && kb.y0 < ka.y1) { const [x, y] = pusat(b); tambah("warn", "kabut", "Area dua Gas Dispersing Unit bertumpuk", x, y, b.id); } } });
    for (const m of doc.m.filter(q => D.mesin[q.f].autofarm).slice(1)) { const [x, y] = pusat(m); tambah("err", "autoGanda", "Auto-Farmer hanya satu per lahan", x, y, m.id); }
  }

  // ---- geometri ----
  const ukur = m => { const f = D.mesin[m.f]; return m.r % 2 ? { w: f.d, h: f.w } : { w: f.w, h: f.d }; };
  // arah aliran mesin: r=0 masuk dari atas, keluar ke bawah
  const arahAlir = r => (1 + r) % 4;

  function selTepi(m, sisi, i) {
    // sel mesin ke-i di tepi menghadap arah sisi (dihitung searah sumbu)
    const u = ukur(m);
    if (sisi === 0) return [m.x + u.w - 1, m.y + i];
    if (sisi === 2) return [m.x, m.y + i];
    if (sisi === 1) return [m.x + i, m.y + u.h - 1];
    return [m.x + i, m.y];
  }
  function sebar(n, L) {
    if (n === 2 && L === 5) return [1, 3];
    const a = Math.floor((L - n) / 2);
    return Array.from({ length: n }, (_, i) => a + i);
  }

  function porta(m) {
    const f = D.mesin[m.f], u = ukur(m), hasil = [];
    if (f.hub) {
      // PAC (data EnKAD): 6 port keluar di timur dan barat pada indeks 1, 4, 7; 14 port masuk di utara dan selatan pada indeks 1-7
      const pasang = (io, sisi, daftar, urut0) => daftar.forEach((i, urut) => {
        const [x, y] = selTepi(m, sisi, i);
        hasil.push({ jenis: "b", io, i: urut0 + urut, x, y, d: sisi, lx: x + DX[sisi], ly: y + DY[sisi], m });
      });
      // PAC boleh dipindah dan diputar: bila diputar, port keluar di utara dan selatan, port masuk di timur dan barat
      const [ka, ki, at, ba] = m.r % 2 ? [3, 1, 0, 2] : [0, 2, 3, 1];
      pasang("out", ka, [1, 4, 7], 0); pasang("out", ki, [1, 4, 7], 3);
      const masuk = [1, 2, 3, 4, 5, 6, 7];
      pasang("in", at, masuk, 0); pasang("in", ba, masuk, 7);
      return hasil;
    }
    const alir = arahAlir(m.r);
    const tambah = (jenis, io, n, sisi, L) => {
      sebar(n, L).forEach((i, urut) => {
        const [x, y] = selTepi(m, sisi, i);
        hasil.push({ jenis, io, i: urut, x, y, d: sisi, lx: x + DX[sisi], ly: y + DY[sisi], m });
      });
    };
    const panjang = s => (s % 2 ? u.w : u.h);
    if (f.bi) tambah("b", "in", f.bi, lawan(alir), panjang(alir));
    if (f.bo) tambah("b", "out", f.bo, alir, panjang(alir));
    // pipa masuk di sisi kanan arah aliran, pipa keluar di sisi kiri (cocok gambar referensi)
    if (f.pi) tambah("p", "in", f.pi, (alir + 1) % 4, panjang((alir + 1) % 4));
    if (f.po) tambah("p", "out", f.po, (alir + 3) % 4, panjang((alir + 3) % 4));
    return hasil;
  }

  function petaMesin(doc, kecuali) {
    const peta = new Map();
    for (const m of doc.m) {
      if (kecuali && kecuali.has(m.id)) continue;
      const u = ukur(m);
      for (let y = m.y; y < m.y + u.h; y++) for (let x = m.x; x < m.x + u.w; x++) peta.set(key(x, y), m);
    }
    return peta;
  }

  function bisaTaruh(doc, m, kecuali) {
    const peta = petaMesin(doc, kecuali), u = ukur(m);
    for (let y = m.y; y < m.y + u.h; y++) for (let x = m.x; x < m.x + u.w; x++) {
      const k = key(x, y);
      if (peta.has(k) || doc.b[k] || doc.p[k]) return false;
    }
    return true;
  }

  // ---- perute: A* berstatus arah; boleh menyeberang tegak lurus sabuk polos (jadi jembatan) ----
  function rute(doc, lapis, ax, ay, bx, by, opsi) {
    opsi = opsi || {};
    const tiles = doc[lapis], mesin = opsi.peta || petaMesin(doc);
    const batas = opsi.ketat ? { x0: 0, y0: 0, x1: doc.area.w - 1, y1: doc.area.h - 1 } : { x0: Math.min(ax, bx, 0) - 8, y0: Math.min(ay, by, 0) - 8, x1: Math.max(ax, bx, doc.area.w) + 8, y1: Math.max(ay, by, doc.area.h) + 8 };
    const h = (x, y) => Math.abs(x - bx) + Math.abs(y - by);
    const kunci = (x, y, d) => x + "," + y + "," + d;
    if (mesin.has(key(ax, ay)) || (mesin.has(key(bx, by)))) return null;
    const portKeluar = new Set();
    for (const m of doc.m) for (const p of porta(m)) if (p.io === "out" && p.jenis === lapis) portKeluar.add(key(p.lx, p.ly) + ":" + p.d);
    const buka = [];
    const push = n => { buka.push(n); let i = buka.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (buka[p].f <= buka[i].f) break; [buka[p], buka[i]] = [buka[i], buka[p]]; i = p; } };
    const pop = () => { const t = buka[0], l = buka.pop(); if (buka.length) { buka[0] = l; let i = 0; for (;;) { let a = 2 * i + 1, b = a + 1, k = i; if (a < buka.length && buka[a].f < buka[k].f) k = a; if (b < buka.length && buka[b].f < buka[k].f) k = b; if (k === i) break; [buka[k], buka[i]] = [buka[i], buka[k]]; i = k; } } return t; };
    const terbaik = new Map();
    for (let d = 0; d < 4; d++) {
      if (opsi.arahAwal !== undefined && d !== opsi.arahAwal) continue;
      const n = { x: ax, y: ay, d, g: 0, f: h(ax, ay), asal: null };
      terbaik.set(kunci(ax, ay, d), 0); push(n);
    }
    let langkah = 0;
    while (buka.length && langkah++ < 60000) {
      const n = pop();
      if (n.x === bx && n.y === by) {
        const jalur = [];
        for (let c = n; c; c = c.asal) jalur.push([c.x, c.y]);
        return jalur.reverse();
      }
      if (n.g > (terbaik.get(kunci(n.x, n.y, n.d)) ?? Infinity)) continue;
      const lain = tiles[key(n.x, n.y)];
      const sedangSeberang = lain && !(n.x === ax && n.y === ay);
      for (let d = 0; d < 4; d++) {
        if (d === lawan(n.d) && n.asal) continue;
        if (sedangSeberang && d !== n.d) continue; // keluar lurus dari titik seberang
        const x = n.x + DX[d], y = n.y + DY[d];
        if (x < batas.x0 || y < batas.y0 || x > batas.x1 || y > batas.y1) continue;
        if (mesin.has(key(x, y))) continue;
        if (opsi.larang && opsi.larang.has(key(x, y)) && !(x === bx && y === by)) continue;
        let g = n.g + 1 + (d !== n.d && n.asal ? 0.6 : 0);
        const t = tiles[key(x, y)];
        if (t && !(x === bx && y === by)) {
          if (t.t || t.d % 2 === d % 2 || belok(tiles, portKeluar, x, y, t)) continue; // hanya sabuk lurus tegak lurus
          g += 3; // jembatan lebih mahal daripada memutar sedikit
        }
        // gabung ke sabuk tidak boleh dari depannya (berhadapan)
        if (t && x === bx && y === by && !t.t && d === lawan(t.d)) continue;
        const k = kunci(x, y, d);
        if (g >= (terbaik.get(k) ?? Infinity)) continue;
        terbaik.set(k, g);
        push({ x, y, d, g, f: g + h(x, y), asal: n });
      }
    }
    return null;
  }

  // Tile ini menerima dari samping (sabuk, gerbang, simpul, atau port), jadi tidak lurus
  function belok(tiles, portKeluar, x, y, t) {
    for (const s of [(t.d + 1) % 4, (t.d + 3) % 4]) {
      const n = tiles[key(x + DX[s], y + DY[s])];
      if (n && (!n.t || n.t === "gate") && n.d === lawan(s)) return true;
      if (n && (n.t === "split" || n.t === "bridge")) return true;
      if (portKeluar.has(key(x, y) + ":" + lawan(s))) return true;
    }
    return false;
  }

  function dirDari(a, b) {
    for (let d = 0; d < 4; d++) if (a[0] + DX[d] === b[0] && a[1] + DY[d] === b[1]) return d;
    return -1;
  }

  // Terapkan jalur ke lapis. arahAkhir = arah keluar tile terakhir (mis. menuju port masuk).
  function pasangJalur(doc, lapis, jalur, arahAkhir, dariAda) {
    const tiles = doc[lapis];
    const ubah = [];
    for (let i = 0; i < jalur.length; i++) {
      const [x, y] = jalur[i], k = key(x, y), ada = tiles[k];
      const d = i < jalur.length - 1 ? dirDari(jalur[i], jalur[i + 1]) : (arahAkhir ?? (i > 0 ? dirDari(jalur[i - 1], jalur[i]) : 0));
      if (d < 0) continue;
      if (!ada) { tiles[k] = { d }; ubah.push(k); continue; }
      if (ada.t === "split" && i === 0 && ada.out && !ada.out.includes(d)) { ada.out.push(d); continue; }
      if (ada.t === "split" || ada.t === "merge" || ada.t === "bridge" || ada.t === "gate") continue;
      if (i === 0 && jalur.length > 1 && !dariAda) { tiles[k] = { t: "split", out: [ada.d, d] }; continue; }  // cabang dari sabuk
      if (i === jalur.length - 1 && (jalur.length > 1 || dariAda)) { tiles[k] = { t: "merge", d: ada.d }; continue; } // gabung ke sabuk
      if (ada.d % 2 !== d % 2) { tiles[k] = { t: "bridge" }; continue; }                                 // menyeberang
      tiles[k] = { d };
    }
    return ubah;
  }

  // ---- jaringan ----
  // Satu sel per tile (jembatan: dua sel, satu per sumbu). Sasaran keluar dihitung dari tetangga.
  function bangunJaringan(doc) {
    const mesinDi = petaMesin(doc);
    const sel = new Map();
    const semua = [];
    const portDi = new Map(); // "lapis:io:lx,ly:d" -> port
    const ports = [];
    for (const m of doc.m) for (const p of porta(m)) {
      ports.push(p);
      portDi.set(p.jenis + ":" + p.io + ":" + key(p.lx, p.ly) + ":" + p.d, p);
    }
    const buat = (lapis, k, x, y, t, sumbu) => {
      const c = { lapis, k, x, y, t: t.t || "b", d: t.d, sumbu, out: t.out, keluar: [], masuk: [], gate: t.item || null, isi: null, umur: 0, rr: 0, giliran: 0, lewat: 0, tLepas: -99 };
      sel.set(lapis + ":" + k + (sumbu === undefined ? "" : ":" + sumbu), c);
      semua.push(c);
      return c;
    };
    for (const lapis of ["b", "p"]) {
      for (const k of Object.keys(doc[lapis])) {
        const t = doc[lapis][k], [x, y] = k.split(",").map(Number);
        if (t.t === "bridge") { buat(lapis, k, x, y, t, 0); buat(lapis, k, x, y, t, 1); } else buat(lapis, k, x, y, t);
      }
    }
    const ambil = (lapis, x, y, sumbu) => sel.get(lapis + ":" + key(x, y) + (sumbu === undefined ? "" : ":" + sumbu)) || sel.get(lapis + ":" + key(x, y));
    const sambung = (c, sasaran) => { c.keluar.push(sasaran); if (sasaran.kind === "sel") sasaran.c.masuk.push(c); };
    // tile memberi ke arah d?
    const beriKe = (c, d) => {
      const x = c.x + DX[d], y = c.y + DY[d];
      const p = portDi.get(c.lapis + ":in:" + key(c.x, c.y) + ":" + lawan(d));
      if (p) return { kind: "port", p };
      const t = doc[c.lapis][key(x, y)];
      if (!t) return null;
      const n = t.t === "bridge" ? ambil(c.lapis, x, y, d % 2) : ambil(c.lapis, x, y);
      if (!n) return null;
      if (n.t === "b" && n.d === lawan(d)) return null; // saling berhadapan
      return { kind: "sel", c: n };
    };
    for (const c of semua) {
      if (c.t === "b" || c.t === "gate" || (c.t === "merge" && c.d !== undefined)) {
        const s = beriKe(c, c.d);
        if (s) sambung(c, s); else c.hadap = !!doc[c.lapis][key(c.x + DX[c.d], c.y + DY[c.d])];
      } else if (c.t === "split" && c.out) {
        for (const d of c.out) { const s = beriKe(c, d); if (s) sambung(c, s); }
      }
    }
    // Hulu dari jembatan atau simpul belum tersambung di tahap ini, jadi dilihat dari tetangganya:
    // sabuk yang dialiri dari situ hanya lewat di depan port, bukan disambung ke port.
    const diberiSimpul = (n, p) => {
      for (let s = 0; s < 4; s++) {
        if (s === n.d || s === lawan(p.d)) continue;
        const x = n.x + DX[s], y = n.y + DY[s], t = doc[n.lapis][key(x, y)];
        if (!t) continue;
        if (t.t === "bridge") {
          const jauh = doc[n.lapis][key(x + DX[s], y + DY[s])];
          if (jauh && !(jauh.d === s && !jauh.t)) return true;
          if (portDi.has(n.lapis + ":out:" + key(x, y) + ":" + lawan(s))) return true;
        } else if (t.t === "merge" && t.d === lawan(s)) return true;
        else if (t.t === "split" && (!t.out || t.out.includes(lawan(s)))) return true;
        else if (t.t === "gate" && t.d === lawan(s)) return true;
      }
      return false;
    };
    // Port keluar -> tile / port masuk langsung
    for (const p of ports) {
      if (p.io !== "out") continue;
      p.sasaran = null;
      // port yang resepnya tidak menghasilkan barang sejenis tidak mengeluarkan apa pun
      // mesin multi-resep: port keluar hanya aktif bila diberi barang
      if (p.m.recs && !keluarMulti(p.m, p)) continue;
      const rp = p.m.rec && RES[p.m.rec];
      if (rp && !rp.out.some(([i]) => (D.barang[i].j === "padat") === (p.jenis === "b"))) continue;
      const langsung = portDi.get(p.jenis + ":in:" + key(p.x, p.y) + ":" + lawan(p.d));
      const t = doc[p.jenis][key(p.lx, p.ly)];
      if (t) {
        const n = t.t === "bridge" ? ambil(p.jenis, p.lx, p.ly, p.d % 2) : ambil(p.jenis, p.lx, p.ly);
        // sabuk yang sudah punya sumber hanya lewat di depan port, bukan disambung ke port ini
        const salahSisi = t.asal !== undefined && t.asal !== lawan(p.d);
        if (n && !salahSisi && !(n.t === "b" && (n.d === lawan(p.d) || n.masuk.length || diberiSimpul(n, p)))) { p.sasaran = { kind: "sel", c: n }; n.dariPort = (n.dariPort || []); n.dariPort.push(p); }
      } else if (langsung && mesinDi.get(key(p.lx, p.ly)) === langsung.m) {
        p.sasaran = { kind: "port", p: langsung };
      }
    }
    // Simpul: splitter/converger/jembatan menyambung ke tetangga yang menerima
    const masukKe = c => {
      const dari = new Set();
      for (const a of semua) for (const s of a.keluar) if (s.kind === "sel" && s.c === c) dari.add(dirDari([c.x, c.y], [a.x, a.y]));
      for (const p of c.dariPort || []) dari.add(lawan(p.d));
      return dari;
    };
    // Beberapa putaran: jembatan berantai & simpul bertetangga mendapat arah dari putaran sebelumnya
    for (let putaran = 0; putaran < 8; putaran++) {
      for (const c of semua) {
        if (c.t === "b" || c.t === "gate" || c.out || (c.t === "merge" && c.d !== undefined)) continue;
        const dari = masukKe(c);
        if (c.t === "bridge") {
          const arahSumbu = c.sumbu === 0 ? [0, 2] : [1, 3];
          const d0 = arahSumbu.find(d => dari.has(d));
          if (d0 === undefined || c.keluar.length) continue;
          const s = beriKe(c, lawan(d0));
          if (s) sambung(c, s);
          continue;
        }
        if (!dari.size) continue;
        for (let d = 0; d < 4; d++) {
          if (dari.has(d)) continue;
          if (c.keluar.some(s => (s.kind === "sel" ? dirDari([c.x, c.y], [s.c.x, s.c.y]) : s.p.d === lawan(d) ? d : -1) === d)) continue;
          const x = c.x + DX[d], y = c.y + DY[d], nt = doc[c.lapis][key(x, y)];
          // simpul bertetangga butuh arah tegas: lewati kalau tetangga polos mengarah ke sini
          if (nt && !nt.t && nt.d === lawan(d)) continue;
          if (nt && (nt.t === "split" || nt.t === "merge") && c.t === "merge") continue;
          const s = beriKe(c, d);
          if (!s) continue;
          // sabuk lain yang sudah punya sumber hanya lewat di samping, bukan cabang simpul ini
          if (s.kind === "sel" && s.c.t === "b" && (s.c.masuk.length || (s.c.dariPort || []).length)) continue;
          if (c.t === "merge" && c.keluar.length) continue;
          sambung(c, s);
        }
      }
    }
    return { sel, semua, ports, portDi, mesinDi };
  }

  // ---- simulasi tick diskret ----
  const CAP_MASUK = amt => Math.max(4, amt * 2);
  const PANCING = 20;

  function resepMesin(m) { return m.rec ? RES[m.rec] : null; }
  // Expanded Crucible (kode emulator EnKAD): semua resep berjalan bersamaan pada satu wadah bersama berisi maksimal 50 per
  // barang, dan barang hanya keluar lewat port yang diberi barang itu.
  const WADAH = 50;
  function keluarMulti(m, p) { return ((p.jenis === "b" ? m.keluarB : m.keluarP) || [])[p.i] || null; }

  function simulasi(doc, opsi) {
    opsi = opsi || {};
    const panas = (opsi.panas ?? 20) * 120, ukurTick = (opsi.ukur ?? 10) * 120;
    const net = bangunJaringan(doc);
    const st = new Map();
    for (const m of doc.m) {
      const f = D.mesin[m.f], r = resepMesin(m);
      const s = { m, f, r, inb: {}, outb: {}, prog: 0, kerja: 0, lapar: 0, tahan: 0, cd: 0, masuk: {}, keluar: {}, ports: [], api: 0 };
      // Bahan awal. Putaran tanam 1 Petik Benih + 2 Penanam tidak menambah jumlah benih selama surplus mengalir,
      // jadi laju penuhnya bergantung pada benih yang diisi pemain di awal.
      const tanam = m.f === "planter_1" || m.f === "seedcollector_1";
      if (m.recs) s.slot = m.recs.map(id => ({ r: RES[id], prog: 0 }));
      if (r) for (const [i, a] of r.in) s.inb[i] = tanam ? Math.max(a * 2, opsi.pancing ?? PANCING) : a * 2;
      if (m.f === "power_station_1") s.bakar = 0;
      st.set(m.id, s);
    }
    for (const p of net.ports) { const s = st.get(p.m.id); s.ports.push(p); p.cd = 0; }
    // urut hilir dulu (DFS mundur) supaya sabuk penuh tetap 30/mnt
    const urut = [];
    const tanda = new Set();
    const dfs = (c0) => {
      const tumpuk = [[c0, 0]];
      tanda.add(c0);
      while (tumpuk.length) {
        const a = tumpuk[tumpuk.length - 1];
        const n = a[0].keluar[a[1]++];
        if (!n) { urut.push(a[0]); tumpuk.pop(); continue; }
        if (n.kind === "sel" && !tanda.has(n.c)) { tanda.add(n.c); tumpuk.push([n.c, 0]); }
      }
    };
    for (const c of net.semua) if (!c.masuk.length && !tanda.has(c)) dfs(c);
    for (const c of net.semua) if (!tanda.has(c)) dfs(c);

    let mengukur = false, tk = 0;
    const siapLepas = c => c.isi && c.umur >= TAHAN[c.lapis] && tk - c.tLepas >= PERIODE[c.lapis];
    const terima = (p, item) => {
      const s = st.get(p.m.id);
      if (s.f.buang === "depot" || s.f.buang === "limbah" || s.f.hub) return true;
      if (s.f.lewat) return (s.inb[item] || 0) < 10;
      // hasil crucible lain boleh masuk wadah lalu keluar lewat port yang sama-sama membawa barang itu
      if (s.slot) return s.slot.some(k => k.r.in.concat(k.r.out).some(([i]) => i === item)) && (s.inb[item] || 0) < WADAH;
      if (s.f.buang === "bakar") {
        const b = D.bakar[item] || (item === "item_originium_ore" ? { daya: 50, dt: 8 } : null);
        return !!b && (s.inb[item] || 0) < 4;
      }
      if (!s.r) return false;
      const e = s.r.in.find(x => x[0] === item);
      if (!e) return false;
      return (s.inb[item] || 0) < CAP_MASUK(e[1]);
    };
    const serah = (p, item) => {
      const s = st.get(p.m.id);
      s.inb[item] = (s.inb[item] || 0) + 1;
      if (mengukur) s.masuk[item] = (s.masuk[item] || 0) + 1;
    };
    const bisaMasukSel = c => !c.isi;
    const lolosGate = (c, item) => !c.gate || c.gate === item;
    const dorong = c => {
      if (!siapLepas(c)) return false;
      const n = c.keluar.length;
      for (let i = 0; i < n; i++) {
        const s = c.keluar[(c.rr + i) % n];
        let ok = false;
        if (s.kind === "port") { if (terima(s.p, c.isi)) { serah(s.p, c.isi); ok = true; } } else if (bisaMasukSel(s.c) && lolosGate(s.c, c.isi) && (s.c.t !== "merge" || n > 1)) { s.c.isi = c.isi; s.c.umur = 0; ok = true; }
        if (ok) { c.terakhir = c.isi; if (mengukur) (c.jenis = c.jenis || new Set()).add(c.isi); c.rr = (c.rr + i + 1) % n; c.isi = null; c.tLepas = tk; if (mengukur) c.lewat++; return true; }
      }
      return false;
    };
    // barang yang siap dikeluarkan sebuah port pada tick ini, atau null
    const itemPort = (s, p) => {
      const jenisCair = p.jenis === "p", dariHub = s.f.hub, dariSlot = !!s.slot, dariLewat = !!s.f.lewat;
      // Resep dua cairan: tiap port pipa membawa satu hasil, hasil pertama di port yang lebih ke hilir aliran mesin,
      // jadi urutannya ikut berputar bersama mesin (anggapan, belum terlihat di game)
      const cairan = jenisCair && s.r ? s.r.out.filter(([i]) => D.barang[i].j !== "padat").map(([i]) => i) : [];
      // bahan yang dioper ke mesin lain tetap disisakan untuk satu kali resep di mesin ini
      const sisakan = dariSlot ? Math.max(0, ...s.slot.map(k => (k.r.in.find(([i]) => i === keluarMulti(s.m, p)) || [0, 0])[1])) : 0;
      return dariLewat ? Object.keys(s.inb).find(i => s.inb[i] > 0) : dariSlot ? ((s.inb[keluarMulti(s.m, p)] || 0) > sisakan ? keluarMulti(s.m, p) : null) : dariHub ? (s.m.keluaran || [])[p.i] : cairan.length > 1 ? (ke => (s.outb[ke] > 0 ? ke : null))(cairan[[0, 1].includes(arahAlir(s.m.r)) ? 1 - p.i : p.i]) : Object.keys(s.outb).find(i => s.outb[i] > 0 && (D.barang[i].j !== "padat") === jenisCair);
    };
    const tarik = c => { // converger memilih masukan bergiliran
      if (c.isi) return;
      // port mesin yang masuk ke converger bergantian dengan jalur sel, jangan sampai kalah terus oleh jalur yang ramai
      if (c.giliranPort && c.dariPort && c.dariPort.some(p => p.cd <= 1 && itemPort(st.get(p.m.id), p))) return;
      const n = c.masuk.length;
      for (let i = 0; i < n; i++) {
        const a = c.masuk[(c.giliran + i) % n];
        // converger dihitung lebih dulu daripada sel hulunya, jadi umur sel hulu pada tick ini belum bertambah
        if (a.isi && a.umur + 1 >= TAHAN[a.lapis] && tk - a.tLepas >= PERIODE[a.lapis] && a.keluar.length === 1) {
          c.isi = a.isi; c.umur = 0; a.terakhir = a.isi; if (mengukur) (a.jenis = a.jenis || new Set()).add(a.isi); a.isi = null; a.tLepas = tk; if (mengukur) a.lewat++;
          c.giliran = (c.giliran + i + 1) % n; // terpisah dari c.rr milik sisi keluar
          c.giliranPort = true;
          return;

    };
    const jejak = opsi.jejak;
    const total = panas + ukurTick;
    for (tk = 0; tk < total; tk++) {
      mengukur = tk >= panas;
      // mesin: produksi
      for (const s of st.values()) {
        const f = s.f;
        if (s.slot) {
          for (const k of s.slot) {
            if (k.prog > 0) {
              k.prog--;
              if (mengukur) s.kerja += 1 / s.slot.length;
              if (k.prog === 0) for (const [i, a] of k.r.out) s.inb[i] = (s.inb[i] || 0) + a;
            }
            if (k.prog === 0 && k.r.in.every(([i, a]) => (s.inb[i] || 0) >= a) && k.r.out.every(([i, a]) => (s.inb[i] || 0) + a <= WADAH)) {
              for (const [i, a] of k.r.in) s.inb[i] -= a;
              k.prog = k.r.dt * 2;
            }
          }
        } else if (f.sumber) {
          if (s.cd > 0) s.cd--;
          const item = s.m.item;
          if (!item) { if (mengukur) s.lapar++; continue; }
          const laju = f.laju ? (doc.lajuConduit && f.sumber === "pompa" ? doc.lajuConduit : f.laju) : f.sumber === "pompa" ? 60 : f.sumber === "gas" ? 60 : f.sumber === "depot" ? 30 : 20 * (s.m.mutu ?? 1);
          const jeda = 120 / laju;
          if (s.cd <= 0 && (s.outb[item] || 0) < 4) { s.outb[item] = (s.outb[item] || 0) + 1; s.cd += jeda; if (mengukur) s.kerja++; }
          else if (mengukur) { if ((s.outb[item] || 0) >= 4) s.tahan++; }
        } else if (f.buang === "bakar") {
          if (s.bakar > 0) { s.bakar--; if (mengukur) { s.kerja++; s.api += s.dayaKini; } } else {
            const item = Object.keys(s.inb).find(i => s.inb[i] > 0);
            if (item) { const b = D.bakar[item] || { daya: 50, dt: 8 }; s.inb[item]--; s.bakar = b.dt * 2; s.dayaKini = b.daya; }
            else if (mengukur) s.lapar++;
          }
        } else if (s.r) {
          const r = s.r, butuh = r.dt * 2;
          if (s.prog > 0) {
            s.prog--;
            if (mengukur) s.kerja++;
            if (s.prog === 0) {
              for (const [i, a] of r.out) { s.outb[i] = (s.outb[i] || 0) + a; if (mengukur) s.keluar[i] = (s.keluar[i] || 0) + a; }
            }
          }
          if (s.prog === 0) {
            const penuh = r.out.some(([i, a]) => (s.outb[i] || 0) + a > Math.max(4, a * 2));
            const siap = r.in.every(([i, a]) => (s.inb[i] || 0) >= a);
            if (penuh) { if (mengukur) s.tahan++; } else if (!siap) { if (mengukur) s.lapar++; } else {
              for (const [i, a] of r.in) s.inb[i] -= a;

      }
      // aliran: hilir dulu
      for (const c of urut) {
        if (c.isi) c.umur++;
        if (c.t !== "merge" || c.isi) dorong(c);
        if (c.t === "merge") tarik(c);
      }
      // mesin: keluarkan lewat port
      for (const s of st.values()) {
        // port keluar bergiliran, supaya hasil tidak selalu lari ke port pertama
        // giliran dihitung per jenis, supaya port pipa tidak mengacaukan giliran port sabuk
        for (const lapisPort of ["b", "p"]) {
        const pk = s.ports.filter(p => p.io === "out" && p.jenis === lapisPort), kunciRR = "rrP" + lapisPort;
        for (let j = 0, awal = s[kunciRR] || 0; j < pk.length; j++) {
          const p = pk[(awal + j) % pk.length];
          if (p.cd > 0) { p.cd--; continue; }
          if (!p.sasaran) continue;
          const dariHub = s.f.hub, dariSlot = !!s.slot, dariLewat = !!s.f.lewat;
          const item = itemPort(s, p);
          if (!item) continue;
          let ok = false;
          if (p.sasaran.kind === "sel") { const c = p.sasaran.c; if (bisaMasukSel(c) && lolosGate(c, item)) { c.isi = item; c.umur = 0; c.giliranPort = false; ok = true; } } else if (terima(p.sasaran.p, item)) { serah(p.sasaran.p, item); ok = true; }
          if (ok) {
            if (dariSlot || dariLewat) s.inb[item]--;
            else if (!dariHub) s.outb[item]--;
            p.cd = PERIODE[p.jenis] - 1;
            s[kunciRR] = ((awal + j) + 1) % pk.length;
            if (mengukur && (s.f.sumber || dariHub || dariSlot)) s.keluar[item] = (s.keluar[item] || 0) + 1;
          }
        }
        }
      }
      if (jejak && tk >= total - jejak.n) jejak.simpan(tk, net, st);
    }
    // hasil per menit
    const hasil = { mesin: {}, sel: new Map(), produksi: {}, pakai: {}, depot: {}, daya: { beban: 0, aktif: 0, bangkit: 0 } };
    const menit = ukurTick / 120;
    for (const c of net.semua) hasil.sel.set(c.lapis + ":" + c.k + (c.sumbu === undefined ? "" : ":" + c.sumbu), { laju: c.lewat / menit, isi: c.isi, barang: c.terakhir || c.isi, jenis: c.jenis ? [...c.jenis] : [], macet: !!c.isi && c.umur > 240 });
    for (const s of st.values()) {
      const f = s.f, id = s.m.id;
      const kerja = s.slot ? s.kerja / ukurTick : s.r ? s.kerja / ukurTick : f.sumber ? Math.min(1, s.kerja * (120 / ((doc.lajuConduit && f.sumber === "pompa" && f.laju ? doc.lajuConduit : f.laju) || (f.sumber === "tambang" ? 20 * (s.m.mutu ?? 1) : f.sumber === "depot" ? 30 : 60))) / ukurTick) : f.buang === "bakar" ? s.kerja / ukurTick : 0;
      const masuk = {}, keluar = {};
      for (const i in s.masuk) masuk[i] = s.masuk[i] / menit;
      for (const i in s.keluar) keluar[i] = s.keluar[i] / menit;
      hasil.mesin[id] = { util: kerja, lapar: s.lapar / ukurTick, tahan: s.tahan / ukurTick, masuk, keluar, punya: s.inb };
      for (const i in keluar) if (f.sumber !== "depot" && !f.hub) hasil.produksi[i] = (hasil.produksi[i] || 0) + keluar[i];
      for (const i in masuk) {

      hasil.daya.beban += f.p || 0;
      hasil.daya.aktif += (f.p || 0) * kerja;
      if (f.buang === "bakar") hasil.daya.bangkit += s.api / ukurTick;
    }
    hasil.net = net;
    return hasil;
  }

  // ---- jangkauan listrik (angka tiang belum terverifikasi, bisa diubah di setelan) ----
  function pusat(m) { const u = ukur(m); return [m.x + u.w / 2, m.y + u.h / 2]; }

  function periksa(doc, sim, opsi) {
    opsi = Object.assign({ radiusTiang: 6, radiusRelay: 4, kabelTiang: 30, kabelRelay: 80 }, opsi);
    const out = [];
    const net = sim.net;
    const tambah = (lvl, kode, teks, x, y, id) => out.push({ lvl, kode, teks, x, y, id });
    const peta = new Map(), semuaMesin = petaMesin(doc), adaBus = doc.m.some(m => m.f === "bus" || m.f === "bus_port");
    for (const m of doc.m) {
      const f = D.mesin[m.f], u = ukur(m), nama = f.n, cx = m.x + u.w / 2, cy = m.y + u.h / 2;
      // Pembongkar dan pemuat harus menempel ke Depot Bus di sisi lawan port-nya (aturan EnKAD)
      if (adaBus && !m.sementara && (m.f === "unloader_1" || m.f === "loader_1")) {
        const pt = porta(m)[0], bl = lawan(pt.d);
        let nempel = false;
        for (let y = m.y; y < m.y + u.h; y++) for (let x = m.x; x < m.x + u.w; x++) { const q = semuaMesin.get(key(x + DX[bl], y + DY[bl])); if (q && (q.f === "bus" || q.f === "bus_port")) nempel = true; }
        if (!nempel) tambah("err", "bus", `${nama} tidak menempel ke Depot Bus`, cx, cy, m.id);
      }
      // Conduit dan tiangnya boleh di luar tepi lahan, seperti di foto Wuling 1.2
      if (!(doc.jenis === "kebun" ? !f.petak : doc.tepiLuar && (m.f === "conduit_out" || m.f === "pylon_x" || m.f === "pylon")) && (m.x < 0 || m.y < 0 || m.x + u.w > doc.area.w || m.y + u.h > doc.area.h)) tambah("err", "area", `${nama} keluar dari area bangun`, cx, cy, m.id);
      for (let y = m.y; y < m.y + u.h; y++) for (let x = m.x; x < m.x + u.w; x++) {
        const k = key(x, y);
        if (peta.has(k) && peta.get(k) !== m) tambah("err", "tumpang", `${nama} menumpuk ${D.mesin[peta.get(k).f].n}`, x, y, m.id);
        peta.set(k, m);
      }
      if (f.listrik || f.statis || f.petak || f.autofarm) continue;
      if ((f.semprot || f.kabut) && !net.ports.some(p => p.m === m && adaMasuk(net, p))) { tambah("err", "port", `${nama}: pipa masuk belum tersambung`, cx, cy, m.id); continue; }
      const r = resepMesin(m);
      if (!f.sumber && !f.buang && !f.lewat && !r && !m.recs) { tambah("err", "resep", `${nama} belum punya resep`, cx, cy, m.id); continue; }
      if (f.sumber && !m.item) { tambah("err", "resep", `${nama} belum dipilih barangnya`, cx, cy, m.id); continue; }
      const ports = porta(m);
      if (r) {
        const cairMasuk = r.in.filter(([i]) => D.barang[i].j !== "padat"), padatMasuk = r.in.filter(([i]) => D.barang[i].j === "padat");
        const cairKeluar = r.out.filter(([i]) => D.barang[i].j !== "padat"), padatKeluar = r.out.filter(([i]) => D.barang[i].j === "padat");
        const tersambung = (jenis, io) => net.ports.filter(p => p.m === m && p.jenis === jenis && p.io === io && (io === "out" ? p.sasaran : adaMasuk(net, p)));
        if (padatMasuk.length && !tersambung("b", "in").length) tambah("err", "port", `${nama}: sabuk masuk belum tersambung (${padatMasuk.map(([i]) => D.barang[i].n).join(", ")})`, cx, cy, m.id);
        if (cairMasuk.length && !tersambung("p", "in").length) tambah("err", "port", `${nama}: pipa masuk belum tersambung (${cairMasuk.map(([i]) => D.barang[i].n).join(", ")})`, cx, cy, m.id);
        if (padatKeluar.length && !tersambung("b", "out").length) tambah("err", "port", `${nama}: hasil ${padatKeluar.map(([i]) => D.barang[i].n).join(", ")} tidak punya jalan keluar`, cx, cy, m.id);
        if (cairKeluar.length && !tersambung("p", "out").length) tambah("err", "port", `${nama}: pipa keluar belum tersambung`, cx, cy, m.id);
      } else if (f.sumber) {
        if (!net.ports.some(p => p.m === m && p.io === "out" && p.sasaran)) tambah("err", "port", `${nama}: keluaran belum tersambung`, cx, cy, m.id);
      }
      const hs = sim.mesin[m.id];
      // pompa dan pembongkar memang mengikuti permintaan; hanya rig dan pengolah yang dinilai
      if (hs && (r || f.sumber === "tambang") && !out.some(e => e.id === m.id && e.lvl === "err")) {
        if (hs.util < 0.985) {
          const sebab = hs.tahan > hs.lapar ? "hasilnya tertahan, jalur keluar penuh" : "kekurangan bahan";
          // mesin hulu yang tertahan hanya menunggu; yang perlu dibenahi mesin yang kekurangan bahan
          tambah(hs.util < 0.5 && hs.tahan <= hs.lapar ? "warn" : "info", "util", `${nama} jalan ${Math.round(hs.util * 100)}%: ${sebab}`, cx, cy, m.id);
        }
      }
    }
    // penghambat: pemasok sudah 100% tetapi pemakainya masih kekurangan
    const sudah = new Set();
    for (const m of doc.m) {
      const r = resepMesin(m), hs = sim.mesin[m.id];
      if (!r || !hs || hs.util >= 0.97 || hs.lapar <= hs.tahan) continue;
      for (const [i, a] of r.in) {
        const pemasok = doc.m.filter(q => { const rq = resepMesin(q); return (rq && rq.out.some(o => o[0] === i)) || (D.mesin[q.f].sumber === "tambang" && q.item === i); });
        if (!pemasok.length || sudah.has(i) || !pemasok.every(q => sim.mesin[q.id].util >= 0.97)) continue;
        sudah.add(i);
        const butuh = a * 60 / r.dt, ada = pemasok.reduce((t, q) => t + (sim.mesin[q.id].keluar[i] || 0), 0), [cx, cy] = pusat(pemasok[0]);
        if (ada >= butuh - 1) continue;
        tambah("warn", "hambat", `Penghambat: ${pemasok.length} ${D.mesin[pemasok[0].f].n} sudah 100% dan hanya membuat ${Math.round(ada)} ${D.barang[i].n}/mnt, padahal ${D.mesin[m.f].n} bisa memakai ${Math.round(butuh)}/mnt`, cx, cy, pemasok[0].id);
      }
    }
    // ujung buntu, percabangan tanpa simpul, barang tak diterima
    for (const c of net.semua) {
      const sisiNama = c.lapis === "b" ? "Sabuk" : "Pipa";
      const titik = `(${c.x}, ${c.y})`, px = c.x + 0.5, py = c.y + 0.5;
      const mTembus = net.mesinDi.get(key(c.x, c.y));
      if (mTembus) tambah("err", "tembus", `${sisiNama} di ${titik} melewati ${D.mesin[mTembus.f].n}, tidak bisa dibangun`, px, py);
      const adaMasukSel = c.masuk.length + (c.dariPort ? c.dariPort.length : 0);
      if ((c.t === "b" || c.t === "gate") && !c.keluar.length) {
        const nx = c.x + DX[c.d], ny = c.y + DY[c.d], m = net.mesinDi.get(key(nx, ny));
        tambah("err", "buntu", c.hadap ? `${sisiNama} berhadapan dengan sabuk lain di ${titik}` : m ? `${sisiNama} menabrak ${D.mesin[m.f].n} di ${titik}, tidak ada port di situ` : `${sisiNama} buntu di ${titik}`, px, py);
      }
      if ((c.t === "b" || c.t === "gate") && !adaMasukSel) tambah("err", "sumber", `${sisiNama} di ${titik} tidak punya sumber`, px, py);
      if (c.t === "bridge" && adaMasukSel && !c.keluar.length) tambah("err", "buntu", `Jembatan di ${titik} tidak punya jalan keluar`, px, py);
      if (c.t === "bridge" && adaMasukSel > 1) tambah("err", "hadap", `Jembatan di ${titik} dimasuki dari dua arah berlawanan`, px, py);
      if (c.t === "split" && !adaMasukSel) tambah("err", "sumber", `Splitter di ${titik} tidak punya masukan`, px, py);
      if (c.t === "split" && adaMasukSel && c.keluar.length < 2) tambah("warn", "simpul", `Splitter di ${titik} hanya punya ${c.keluar.length} keluaran`, px, py);
      if (c.t === "merge" && !c.keluar.length) tambah("err", "buntu", `Converger di ${titik} tidak punya keluaran`, px, py);
      if (c.t === "merge" && adaMasukSel < 2) tambah("warn", "simpul", `Converger di ${titik} hanya punya ${adaMasukSel} masukan`, px, py);
      if (c.t === "b" && (c.masuk.length + (c.dariPort ? c.dariPort.length : 0)) > 1) tambah("err", "gabung", `${sisiNama} di (${c.x}, ${c.y}) menerima dari dua arah, pakai Converger`, c.x + 0.5, c.y + 0.5);
      if (!(doc.tepiLuar && c.lapis === "p") && (c.x < 0 || c.y < 0 || c.x >= doc.area.w || c.y >= doc.area.h)) tambah("err", "area", `${sisiNama} keluar area di (${c.x}, ${c.y})`, c.x + 0.5, c.y + 0.5);
      const r = sim.sel.get(c.lapis + ":" + c.k + (c.sumbu === undefined ? "" : ":" + c.sumbu));
      if (r && r.jenis.length > 1 && !c.masuk.some(a => { const q = sim.sel.get(a.lapis + ":" + a.k + (a.sumbu === undefined ? "" : ":" + a.sumbu)); return q && q.jenis.length > 1; })) tambah("warn", "campur", `${sisiNama} di (${c.x}, ${c.y}) membawa ${r.jenis.map(i => D.barang[i].n).join(" + ")} bercampur, bisa macet`, c.x + 0.5, c.y + 0.5);
      if (r && c.keluar.length === 1 && c.keluar[0].kind === "port" && r.macet) {
        const tuju = c.keluar[0].p.m, ft = D.mesin[tuju.f], tr = resepMesin(tuju);
        if (!ft.buang && tr && !tr.in.some(([i]) => i === r.isi)) tambah("err", "salah", `${D.barang[r.isi].n} tidak dipakai ${ft.n}, jalur macet`, c.x + 0.5, c.y + 0.5, tuju.id);
      }
    }
    // Satu lahan hanya punya satu PAC
    for (const m of doc.m.filter(q => D.mesin[q.f].hub).slice(1)) { const [x, y] = pusat(m); tambah("err", "pacGanda", "PAC hanya bisa satu", x, y, m.id); }
    if (doc.jenis === "kebun") periksaKebun(doc, sim, tambah);
    // listrik
    const sumberDaya = doc.m.filter(m => D.mesin[m.f].listrik);
    const butuh = doc.m.filter(m => D.mesin[m.f].p > 0);
    const kena = (m, s) => {
      const r = D.mesin[s.f].listrik === "tiang" ? opsi.radiusTiang : opsi.radiusRelay, u = ukur(m), us = ukur(s);
      return m.x < s.x + us.w + r && m.x + u.w > s.x - r && m.y < s.y + us.h + r && m.y + u.h > s.y - r;
    };
    if (butuh.length && !sumberDaya.length) tambah("warn", "listrik", "Belum ada Electric Pylon, mesin tidak mendapat daya", doc.area.w / 2, doc.area.h / 2);
    else for (const m of butuh) if (!sumberDaya.some(s => kena(m, s))) { const [x, y] = pusat(m); tambah("warn", "listrik", `${D.mesin[m.f].n} di luar jangkauan tiang`, x, y, m.id); }
    const beban = sim.daya.beban, dayaAda = (doc.dayaDasar || 0) + sim.daya.bangkit;
    if (beban > dayaAda) tambah("err", "daya", `Beban daya ${Math.round(beban)} melebihi pasokan ${Math.round(dayaAda)}`, doc.area.w / 2, doc.area.h / 2);
    const urutan = { err: 0, warn: 1, info: 2 };
    out.sort((a, b) => urutan[a.lvl] - urutan[b.lvl]);

const uang = v => Math.round(v).toLocaleString("id-ID");

function resepDiDenah() { const p = {}; for (const m of DOC.m) { const r = AIC.resepMesin(m); if (r) for (const [o] of r.out) p[o] = p[o] || r.id; } return p; }
function barangUtama() {
  const s = ED.sim;
  const dipilih = [...ED.sel].find(x => x.startsWith("m:"));
  if (dipilih) { const m = DOC.m.find(q => "m:" + q.id === dipilih), r = m && AIC.resepMesin(m); if (r && r.out[0]) return r.out[0][0]; if (m && m.item) return m.item; }
  if (s) {
    // Produk paling mahal yang benar-benar dijual lebih berguna daripada barang antara yang paling banyak
    const jual = AIC.ekonomi(DOC, s).jual.slice().sort((a, b) => (b.uang || 0) - (a.uang || 0))[0];
    if (jual) return jual.i;
    const d = Object.keys(s.depot).sort((a, b) => s.depot[b] - s.depot[a])[0]; if (d) return d;
  }
  const bakar = DOC.m.find(m => m.f === "tools_assebling_mc_1" && m.rec); if (bakar) return AIC.RES[bakar.rec].out[0][0];
  return "item_proc_battery_3";
}
function panelRantai(box) {
  const item = ED.rantaiItem || barangUtama();
  const dasar = AIC.resepUntuk(item)[0], lajuDef = dasar ? 60 / dasar.dt * dasar.out.find(o => o[0] === item)[1] : 30;
  const pilih = Object.assign(resepDiDenah(), ED.pilihRantai || {});
  const r0 = pilih[item] && AIC.RES[pilih[item]];
  const lajuAsal = ED.rantaiLaju ?? (ED.sim && ED.sim.depot[item]) ?? (r0 ? 60 / r0.dt * r0.out.find(o => o[0] === item)[1] : lajuDef);
  // Pilihan cepat: produk yang dijual denah ini
  const ek = ED.sim ? AIC.ekonomi(DOC, ED.sim) : null;
  if (ek && ek.jual.length) {
    const d = bikin("div", "pilihProduk");
    for (const r of ek.jual.slice().sort((a, c) => (c.uang || 0) - (a.uang || 0))) {
      const b = bikin("button"), im = bikin("img"); im.src = urlIkon(r.i); im.alt = "";
      b.append(im, bikin("span", "", D.barang[r.i].n)); b.setAttribute("aria-pressed", String(r.i === item));
      b.onclick = () => { ED.rantaiItem = r.i; ED.rantaiLaju = null; tulisPanel(); };
      d.append(b);
    }
    box.append(d);
  }
  const f = bikin("div", "isian");
  f.style.gridTemplateColumns = "auto minmax(0,1fr)";
  const urut = Object.keys(D.barang).sort((a, b) => D.barang[a].n.localeCompare(D.barang[b].n));
  isian(f, "Barang", item, "", v => { ED.rantaiItem = v; ED.rantaiLaju = null; tulisPanel(); }, urut.map(i => [i, D.barang[i].n]));
  isian(f, "Sasaran /mnt", +bulatAngka(lajuAsal), "number", v => { ED.rantaiLaju = Math.max(0.01, +v || 1); tulisPanel(); });
  box.append(f);
  const t = AIC.rantai(item, lajuAsal, pilih);
  const lama = n => (n.dt || 0) + Math.max(0, ...n.anak.map(lama));
  const ada = {}; for (const m of DOC.m) if (m.rec) ada[m.rec] = (ada[m.rec] || 0) + 1;
  const pembongkar = {}, namaSumber = {}, lajuSumber = {};
  for (const m of DOC.m) {

    if (ED.undo.length) return; // pengguna sudah mulai bekerja, jangan ditimpa
    let dariServer = null;
    try { const q = await docPribadi("ingat").get(); dariServer = q && q.exists ? q.data() : null; } catch (err) { /* pakai salinan browser */ }
    const daftar = await daftarRancangan();
    if (ED.undo.length) return;
    const lokal = bacaIngatan(), g = dariServer && (!lokal || (dariServer.waktu || "") > (lokal.waktu || "")) ? dariServer : lokal;
    // Cukup buka ulang bila server menunjuk rancangan lain atau browser ini belum punya salinannya
    const sudah = g && g.id ? ED.docId === g.id : g && g.uji ? ED.sumberUji === g.uji : false;
    if (!sudah && (g || daftar.length)) pulihkan(g, daftar);
  }, () => {});
}
